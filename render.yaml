services:
  # Web Service - Your Express.js + React Application
  - type: web
    name: joulewise
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: joulewise-db
          property: connectionString
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: joulewise-db
    plan: free
    databaseName: joulewise
    user: joulewise
    region: oregon
    ipAllowList: []
